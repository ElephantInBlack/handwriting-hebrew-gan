<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל כתב יד בזמן אמת - React</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">

    <!-- Start the two large inference downloads as early and in parallel as possible. -->
    <link rel="preload" href="./hebrew_gan_int8_V7.2.8.onnx" as="fetch" crossorigin="anonymous">
    <link rel="preload"
        href="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort-wasm-simd-threaded.wasm"

    <!-- Exact dependency versions: upgrade only after the browser smoke test passes. -->

    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- External Dependencies -->

    <link rel="stylesheet" href="style.css?v=5">

        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;800&family=Assistant:wght@400;600;800&display=swap"
